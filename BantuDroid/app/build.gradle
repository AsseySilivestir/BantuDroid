plugins {
    id 'com.android.application'
}

android {
    namespace 'com.bantu.droid'
    compileSdk 34
    // ndkVersion removed - using pre-built .so from jniLibs/

    defaultConfig {
        applicationId "com.bantu.droid"
        minSdk 24
        targetSdk 34
        versionCode 296
        versionName "2.10.1"

        ndk {
            abiFilters 'arm64-v8a'
        }

        // libbanturun.so is pre-built in jniLibs/ — skip NDK compile to save build time
        // externalNativeBuild {
        //     cmake {
        //         cppFlags '-std=c++17'
        //         arguments '-DANDROID_STL=c++_shared'
        //     }
        // }
    }

    // CMake build disabled — using pre-built .so from jniLibs/
    // externalNativeBuild {
    //     cmake {
    //         path file('src/main/cpp/CMakeLists.txt')
    //         version '3.22.1'
    //     }
    // }

    signingConfigs {
        release {
            storeFile file('release.keystore')
            storePassword 'bantudroid'
            keyAlias 'bantudroid'
            keyPassword 'bantudroid'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Force extraction of native libraries (critical for executing libbantu.so)
    // Without this, AGP 8.2+ defaults to extractNativeLibs=false and .so files
    // stay compressed in the APK — never extracted to nativeLibraryDir
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets']
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    // Do not strip symbols from native libs — helps debugging
    // buildTypes.all {
    //     ndk {
    //         debugSymbolLevel 'FULL'
    //     }
    // }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.webkit:webkit:1.9.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.github.mwiede:jsch:0.2.16'
    // OkHttp — used by BantuTunnelClient for WebSocket connection to bantu-tunnel server
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
